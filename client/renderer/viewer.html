<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>Panic Alarm Monitor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"Segoe UI",sans-serif; background: #0d0d1a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { background: #12122a; border-bottom: 2px solid #e74c3c; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 15px; color: #fff; letter-spacing: 1px; font-weight: 700; }
.info-badge { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4); color: #ff6b6b; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.status-bar { padding: 5px 20px; font-size: 12px; background: #0a0a16; border-bottom: 1px solid #1a1a2e; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.status-bar.ok { color: #2ecc71; }
.status-bar.err { color: #e74c3c; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.dot.live { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .15; } }
main { flex: 1; overflow-y: auto; padding: 20px; }
h2 { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.alarm-list { display: flex; flex-direction: column; gap: 10px; }
.alarm-card { background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.35); border-radius: 8px; padding: 14px 18px; animation: slidein .25s ease; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
.alarm-card.acked { background: rgba(39,174,96,0.08); border-color: rgba(39,174,96,0.25); }
.alarm-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.alarm-title { font-size: 16px; font-weight: 700; color: #ff6b6b; }
.alarm-card.acked .alarm-title { color: #2ecc71; }
.alarm-meta  { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 6px; line-height: 1.6; }
.btn-ack { padding: 6px 16px; background: #e74c3c; color: #fff; border: none; border-radius: 5px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.btn-ack:hover { background: #c0392b; }
.btn-ack:disabled { background: #2ecc71; cursor: default; }
.empty { text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; padding: 70px 0; }
.empty .eicon { font-size: 40px; display: block; margin-bottom: 12px; }
.btn-settings { padding: 4px 12px; background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); border-radius: 5px; font-size: 11px; cursor: pointer; }
.btn-settings:hover { border-color: #3498db; color: #3498db; }
.clock { font-size: 12px; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>🚨 PANIC ALARM MONITOR</h1>
    <span class="info-badge" id="userBadge">—</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="clock" id="clock"></span>
  </div>
</header>
<div class="status-bar err" id="statusBar">
  <span class="dot" id="dot"></span>
  <span id="statusText">Connecting…</span>
</div>
<main>
  <h2>Active &amp; Recent Alarms</h2>
  <div class="alarm-list" id="alarmList">
    <div class="empty" id="emptyMsg">
      <span class="eicon">✅</span>No active alarms. Monitoring.
    </div>
  </div>
</main>

<script src="../../node_modules/socket.io-client/dist/socket.io.min.js"></script>
<script>
  const api = window.electronAPI;
  let socket, config;
  const alarms = {};

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

  async function init() {
    config = await api.getConfig();
    if (config) { applyConfig(config); connectSocket(); }
  }

  api.onClientConfig(cfg => {
    config = cfg; applyConfig(cfg);
    if (!socket || !socket.connected) connectSocket();
  });

  function applyConfig(cfg) {
    document.getElementById('userBadge').textContent =
      `${cfg.user_name} · Room ${cfg.room_number} · ${cfg.hospitalCode}`;
  }

  function connectSocket() {
    if (socket) { socket.disconnect(); socket = null; }
    socket = io(config.serverUrl, { transports: ['websocket','polling'], reconnectionDelay: 2000 });

    socket.on('connect', () => {
      setStatus(true);
      socket.emit('join', { hospitalCode: config.hospitalCode, userName: config.user_name });
    });
    socket.on('disconnect',    () => setStatus(false));
    socket.on('connect_error', () => setStatus(false));

    socket.on('panic_alarm', alarm => {
      api.showAlertPopup(alarm);
      addAlarmCard(alarm);
    });

    socket.on('alarm_acknowledged', ({ alarmId, ackBy }) => markAcknowledged(alarmId, ackBy));
  }

  function setStatus(online) {
    const bar  = document.getElementById('statusBar');
    const dot  = document.getElementById('dot');
    const text = document.getElementById('statusText');
    bar.className   = 'status-bar ' + (online ? 'ok' : 'err');
    dot.className   = 'dot' + (online ? ' live' : '');
    text.textContent = online
      ? `Connected — ${config?.serverUrl}`
      : `Disconnected — retrying (${config?.serverUrl || ''})`;
  }

  function addAlarmCard(alarm) {
    if (alarms[alarm.alarmId]) return;
    alarms[alarm.alarmId] = alarm;
    document.getElementById('emptyMsg').style.display = 'none';
    const card = document.createElement('div');
    card.className = 'alarm-card';
    card.id = 'card-' + alarm.alarmId;
    card.innerHTML = `
      <div class="alarm-row">
        <div class="alarm-title">🚨 ${esc(alarm.triggeredBy)} needs help!</div>
        <button class="btn-ack" onclick="acknowledge('${alarm.alarmId}',this)">✔ ACKNOWLEDGE</button>
      </div>
      <div class="alarm-meta">
        <strong>Room:</strong> ${esc(alarm.roomNumber)} &nbsp;·&nbsp;
        <strong>System:</strong> ${esc(alarm.systemNumber || '—')} &nbsp;·&nbsp;
        <strong>Hospital:</strong> ${esc(alarm.hospitalCode)} &nbsp;·&nbsp;
        ${new Date(alarm.triggeredAt).toLocaleString()}
      </div>`;
    document.getElementById('alarmList').prepend(card);
  }

  function markAcknowledged(alarmId, ackBy) {
    const card = document.getElementById('card-' + alarmId);
    if (!card) return;
    card.classList.add('acked');
    const btn = card.querySelector('.btn-ack');
    if (btn) { btn.textContent = `✔ Acked: ${ackBy}`; btn.disabled = true; }
  }

  async function acknowledge(alarmId, btn) {
    btn.disabled = true; btn.textContent = '…';
    try {
      const resp = await fetch(`${config.serverUrl}/api/client/alarm/acknowledge`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${config.token}` },
        body: JSON.stringify({ alarmId }),
      });
      if (!resp.ok) { btn.disabled = false; btn.textContent = '✔ ACKNOWLEDGE'; }
    } catch { btn.disabled = false; btn.textContent = '✔ ACKNOWLEDGE'; }
  }

  function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  init();
</script>
</body>
</html>
