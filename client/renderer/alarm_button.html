<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>PANIC ALARM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 90px; height: 90px;
  background: transparent;
  overflow: hidden; user-select: none;
}
.wrap {
  width: 90px; height: 90px;
  display: flex; align-items: center; justify-content: center;
}
.btn-alert {
  width: 86px; height: 86px;
  border-radius: 50%;
  background: var(--btn-fill, rgba(5,150,105,0.25));
  border: 1.5px solid #000000;
  box-shadow: 0 0 0 1px #000000;
  cursor: grab;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: transform .08s, background .15s;
}
.btn-alert:hover {
  background: var(--btn-fill-hover, rgba(5,150,105,0.45));
  border: 1.5px solid #000000;
  box-shadow: 0 0 0 1px #000000;
  transform: scale(1.04);
}
.btn-alert:active { cursor: grabbing; transform: scale(0.95); }

/* Armed state */
.btn-alert.armed {
  background: rgba(255,200,0,0.35);
  border: 1.5px solid #000000;
  box-shadow: 0 0 0 1px #000000;
  transform: scale(1.04);
}

.btn-label, .btn-sublabel { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn-alert" id="btnAlert"
    title="Click to arm · Click again to send PANIC ALARM · Drag to move">
    <div class="btn-label"    id="btnLabel"></div>
    <div class="btn-sublabel" id="btnSub"></div>
  </button>
</div>

<script>
  const api = window.electronAPI;
  let config         = null;
  let isFiring       = false;
  let armed          = false;
  let armTimer       = null;
  let sentSolidTimer = null;

  // ── Colour presets — [r, g, b] ────────────────────────────────────
  const COLOURS = [
    [220,  38,  38],   // red
    [234,  88,  12],   // orange
    [202, 138,   4],   // yellow
    [  5, 150, 105],   // green
    [ 37,  99, 235],   // blue
    [124,  58, 237],   // purple
    [ 71,  85, 105],   // dark
  ];

  let isSolid = false;

  function applyColour(idx) {
    const [r, g, b] = COLOURS[idx] || COLOURS[3];
    const root = document.documentElement;
    const fill   = isSolid ? 1.0 : 0.25;
    const fillH  = isSolid ? 1.0 : 0.45;
    root.style.setProperty('--btn-fill',         `rgba(${r},${g},${b},${fill})`);
    root.style.setProperty('--btn-fill-hover',    `rgba(${r},${g},${b},${fillH})`);
  }

  function applySolid(solid) {
    isSolid = solid;
    if (!config) config = {};
    config.alertButtonSolid = solid;
    applyColour(config?.alertButtonColour ?? 3);
    api.setAlertSolid(solid);
  }

  function applyConfig(cfg) {
    if (!cfg) return;
    config = cfg;
    // While locked after sending (in 20s alarm red state), keep the red state
    if (!sentSolidTimer) {
      isSolid = cfg?.alertButtonSolid ?? false;
      applyColour(cfg?.alertButtonColour ?? 3);
    }
  }
  api.getConfig().then(applyConfig);
  api.onClientConfig(applyConfig);

  // ── Right-click → colour picker ───────────────────────────────────
  document.addEventListener('contextmenu', e => { e.preventDefault(); api.showColourMenu(); });
  api.onColourChange(idx => {
    if (!config) config = {};
    config.alertButtonColour = idx;
    if (!sentSolidTimer) {
      applyColour(idx);
    }
    api.setAlertButtonColour(idx);
  });
  api.onSolidChange(solid => {
    if (!config) config = {};
    config.alertButtonSolid = solid;
    if (!sentSolidTimer) {
      applySolid(solid);
    } else {
      api.setAlertSolid(solid);
    }
  });

  // ── Drag to move ──────────────────────────────────────────────────
  let dragging = false, dragX = 0, dragY = 0, moved = false;

  document.getElementById('btnAlert').addEventListener('mousedown', e => {
    if (e.button !== 0 || isFiring) return;
    dragging = true; moved = false;
    dragX = e.screenX; dragY = e.screenY;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.screenX - dragX, dy = e.screenY - dragY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    if (moved) { api.moveAlarmWindow({ dx, dy }); dragX = e.screenX; dragY = e.screenY; }
  });
  document.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    const wasDrag = moved;
    dragging = false; moved = false;
    if (!wasDrag) handleClick();
  });

  // ── Click: arm → confirm → fire ──────────────────────────────────
  function handleClick() {
    if (isFiring || sentSolidTimer) return;   // solid after a send = locked, no new alarm
    if (!armed) { arm(); } else { disarm(); fireAlarm(); }
  }

  function arm() {
    armed = true;
    document.getElementById('btnAlert').classList.add('armed');
    document.getElementById('btnLabel').textContent = 'TAP';
    document.getElementById('btnSub').textContent   = 'AGAIN!';
    armTimer = setTimeout(() => {
      disarm();
    }, 3000);
  }

  function disarm() {
    armed = false;
    clearTimeout(armTimer); armTimer = null;
    document.getElementById('btnAlert').classList.remove('armed');
    document.getElementById('btnLabel').textContent = 'PANIC';
    document.getElementById('btnSub').textContent   = 'ALARM';
  }

  // ── Fire alarm ────────────────────────────────────────────────────
  async function fireAlarm() {
    if (isFiring || !config?.token) return;
    isFiring = true;
    const btn = document.getElementById('btnAlert');
    document.getElementById('btnLabel').textContent = 'SENT';
    document.getElementById('btnSub').textContent   = '...';

    let sent = false;
    try {
      const resp = await fetch(`${config.serverUrl}/api/client/alarm/trigger`, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body   : '{}',
        signal : AbortSignal.timeout(10000),
      });
      if (resp.ok) {
        const body = await resp.json().catch(() => ({}));
        sent = !body.ignored;   // server ignores alarms inside its 20 s lock
      }
    } catch { /* sent stays false */ }

    if (!sent) {
      // Not delivered (or ignored by the server's 20 s lock) — stay silent, do not lock
      setTimeout(() => {
        document.getElementById('btnLabel').textContent = 'PANIC';
        document.getElementById('btnSub').textContent   = 'ALARM';
        isFiring = false;
      }, 2000);
      return;
    }

    // Change to RED colour (solid) on Alarm trigger for next 20 seconds,
    // and block new alarms; then revert to the user's saved colour preference
    isSolid = true;
    applyColour(0); // Index 0 is Red [220, 38, 38]
    if (sentSolidTimer) clearTimeout(sentSolidTimer);
    sentSolidTimer = setTimeout(() => {
      sentSolidTimer = null;
      isSolid = config?.alertButtonSolid ?? false;
      applyColour(config?.alertButtonColour ?? 3);
    }, 20000);

    setTimeout(() => {
      document.getElementById('btnLabel').textContent = 'PANIC';
      document.getElementById('btnSub').textContent   = 'ALARM';
      isFiring = false;
    }, 2000);
  }
</script>
</body>
</html>
