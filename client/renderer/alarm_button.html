<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>ALERT</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 130px; height: 130px; background: transparent; overflow: hidden; user-select: none; }
.wrap {
  width: 130px; height: 130px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; cursor: move; -webkit-app-region: drag;
}
.btn-alert {
  width: 110px; height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #ff6b6b, #c0392b);
  border: 5px solid #fff;
  box-shadow: 0 0 0 4px rgba(231,76,60,0.7), 0 6px 24px rgba(0,0,0,0.6);
  cursor: pointer;
  -webkit-app-region: no-drag;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform 0.1s;
}
.btn-alert:active { transform: scale(0.93); }
.btn-alert.firing { animation: pulse 0.5s ease-in-out 3; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 4px rgba(231,76,60,0.7); }
  50%  { box-shadow: 0 0 0 20px rgba(231,76,60,0.25), 0 6px 40px rgba(231,76,60,0.5); }
  100% { box-shadow: 0 0 0 4px rgba(231,76,60,0.7); }
}
.alert-text { font-family: -apple-system,"Segoe UI",sans-serif; font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; text-transform: uppercase; -webkit-app-region: no-drag; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
.alert-icon { font-size: 24px; -webkit-app-region: no-drag; }
.status { font-family: -apple-system,"Segoe UI",sans-serif; font-size: 9px; color: rgba(255,255,255,0.5); -webkit-app-region: no-drag; text-align: center; max-width: 120px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn-alert" id="btnAlert" title="Click to send ALERT to all rooms!">
    <div class="alert-icon">🆘</div>
    <div class="alert-text">ALERT</div>
  </button>
  <div class="status" id="status">Ready</div>
</div>

<script>
  const api = window.electronAPI;
  let config = null, isFiring = false;

  function applyConfig(cfg) { config = cfg; }
  api.getConfig().then(applyConfig);
  api.onClientConfig(applyConfig);

  document.getElementById('btnAlert').addEventListener('click', async () => {
    if (isFiring || !config?.token) return;
    isFiring = true;
    const btn    = document.getElementById('btnAlert');
    const status = document.getElementById('status');
    btn.classList.add('firing');
    status.textContent = 'Sending…';

    try {
      const resp = await fetch(`${config.serverUrl}/api/client/alarm/trigger`, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body   : '{}',
      });
      const data = await resp.json();
      status.textContent = resp.ok ? '✅ Sent!' : '❌ ' + (data.error || 'Error');
    } catch {
      status.textContent = '❌ No server';
    }

    setTimeout(() => {
      btn.classList.remove('firing');
      status.textContent = 'Ready';
      isFiring = false;
    }, 3000);
  });
</script>
</body>
</html>
