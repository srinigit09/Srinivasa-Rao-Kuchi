<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>PANIC ALARM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 90px; height: 90px;
  background: transparent;
  overflow: hidden; user-select: none;
}
.wrap {
  width: 90px; height: 90px;
  display: flex; align-items: center; justify-content: center;
}
.btn-alert {
  width: 86px; height: 86px;
  border-radius: 50%;
  background: var(--btn-fill, rgba(5,150,105,0.25));
  border: 1.5px solid #000000;
  box-shadow: 0 0 0 1px #000000;
  cursor: grab;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: transform .08s, background .15s;
}
.btn-alert:hover {
  background: var(--btn-fill-hover, rgba(5,150,105,0.45));
  border: 1.5px solid #000000;
  box-shadow: 0 0 0 1px #000000;
  transform: scale(1.04);
}
.btn-alert:active { cursor: grabbing; transform: scale(0.95); }

/* Armed state — NO colour change (the button turns red only after a successful send) */
.btn-alert.armed {
  transform: scale(1.04);
}

.btn-label, .btn-sublabel { display: none; }

/* Result text ("SENT OK" / "NOT SENT!") is shown on the button for 1-2 seconds only, then hidden again */
.btn-alert.status .btn-label, .btn-alert.status .btn-sublabel {
  display: block; color: #fff; font-weight: 800; line-height: 1.1; text-align: center;
  text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.btn-alert.status .btn-label    { font-size: 17px; }
.btn-alert.status .btn-sublabel { font-size: 14px; }
/* "TAP AGAIN!" text: appears 0.8 s after the first tap and stays 1 s (the button keeps its colour; stays armed for 3 s) */
.btn-alert.armed.show-tap .btn-label, .btn-alert.armed.show-tap .btn-sublabel {
  display: block; color: #fff; font-weight: 800; line-height: 1.1; text-align: center;
  text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.btn-alert.armed.show-tap .btn-label    { font-size: 17px; }
.btn-alert.armed.show-tap .btn-sublabel { font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn-alert" id="btnAlert"
    title="Click to arm · Click again to send PANIC ALARM · Drag to move">
    <div class="btn-label"    id="btnLabel"></div>
    <div class="btn-sublabel" id="btnSub"></div>
  </button>
</div>

<script>
  const api = window.electronAPI;
  let config         = null;
  let isFiring       = false;
  let armed          = false;
  let armTimer       = null;
  let sentSolidTimer = null;

  // ── Colour presets — [r, g, b] ────────────────────────────────────
  const COLOURS = [
    [220,  38,  38],   // red
    [234,  88,  12],   // orange
    [202, 138,   4],   // yellow
    [  5, 150, 105],   // green
    [ 37,  99, 235],   // blue
    [124,  58, 237],   // purple
    [ 71,  85, 105],   // dark
  ];

  let isSolid = false;

  function applyColour(idx) {
    const [r, g, b] = COLOURS[idx] || COLOURS[3];
    const root = document.documentElement;
    const fill   = isSolid ? 1.0 : 0.25;
    const fillH  = isSolid ? 1.0 : 0.45;
    root.style.setProperty('--btn-fill',         `rgba(${r},${g},${b},${fill})`);
    root.style.setProperty('--btn-fill-hover',    `rgba(${r},${g},${b},${fillH})`);
  }

  function applySolid(solid) {
    isSolid = solid;
    if (!config) config = {};
    config.alertButtonSolid = solid;
    applyColour(config?.alertButtonColour ?? 3);
    api.setAlertSolid(solid);
  }

  function applyConfig(cfg) {
    if (!cfg) return;
    config = cfg;
    // While locked after sending (in 20s alarm red state), keep the red state
    if (!sentSolidTimer) {
      isSolid = cfg?.alertButtonSolid ?? false;
      applyColour(cfg?.alertButtonColour ?? 3);
    }
  }
  api.getConfig().then(applyConfig);
  api.onClientConfig(applyConfig);

  // ── Right-click → colour picker ───────────────────────────────────
  document.addEventListener('contextmenu', e => { e.preventDefault(); api.showColourMenu(); });
  api.onColourChange(idx => {
    if (!config) config = {};
    config.alertButtonColour = idx;
    if (!sentSolidTimer) {
      applyColour(idx);
    }
    api.setAlertButtonColour(idx);
  });
  api.onSolidChange(solid => {
    if (!config) config = {};
    config.alertButtonSolid = solid;
    if (!sentSolidTimer) {
      applySolid(solid);
    } else {
      api.setAlertSolid(solid);
    }
  });

  // ── Drag to move ──────────────────────────────────────────────────
  let dragging = false, dragX = 0, dragY = 0, moved = false;

  document.getElementById('btnAlert').addEventListener('mousedown', e => {
    if (e.button !== 0 || isFiring) return;
    dragging = true; moved = false;
    dragX = e.screenX; dragY = e.screenY;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.screenX - dragX, dy = e.screenY - dragY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    if (moved) { api.moveAlarmWindow({ dx, dy }); dragX = e.screenX; dragY = e.screenY; }
  });
  document.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    const wasDrag = moved;
    dragging = false; moved = false;
    if (!wasDrag) handleClick();
  });

  // ── Click: arm → confirm → fire ──────────────────────────────────
  function handleClick() {
    if (isFiring || sentSolidTimer) return;   // solid after a send = locked, no new alarm
    // While "NOT SENT!" is showing, one click = clear it and resend immediately (no "TAP AGAIN!").
    // It reappears only if this resend fails too.
    if (statusKind === 'fail') { clearStatus(); fireAlarm(); return; }
    if (!armed) { arm(); } else { disarm(); fireAlarm(); }
  }

  // ── Result text on the button: "NOT SENT!" 2 s, "SENT OK" 1 s ────
  let statusTimer = null;
  let statusKind  = null;   // 'fail' | 'ok' | null — which result text is currently on the button
  function clearStatus() {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    statusKind = null;
    document.getElementById('btnAlert').classList.remove('status', 'status-fail', 'status-ok');
    document.getElementById('btnLabel').textContent = 'PANIC';
    document.getElementById('btnSub').textContent   = 'ALARM';
  }
  function showStatus(line1, line2, kind, ms) {
    clearStatus();
    document.getElementById('btnLabel').textContent = line1;
    document.getElementById('btnSub').textContent   = line2;
    document.getElementById('btnAlert').classList.add('status', 'status-' + kind);
    statusKind = kind;
    statusTimer = setTimeout(clearStatus, ms);
  }

  // "TAP AGAIN!" appears 0.8 s AFTER the first tap (so a quick double-click never sees it flash),
  // stays 1 s, while the button remains armed for 3 s in total.
  const TAP_TEXT_DELAY_MS = 800;
  let tapTextTimer = null, tapTextHideTimer = null;
  function arm() {
    clearStatus();
    armed = true;
    document.getElementById('btnAlert').classList.add('armed');
    document.getElementById('btnLabel').textContent = 'TAP';
    document.getElementById('btnSub').textContent   = 'AGAIN!';
    tapTextTimer = setTimeout(() => {
      document.getElementById('btnAlert').classList.add('show-tap');
      tapTextHideTimer = setTimeout(() => {
        document.getElementById('btnAlert').classList.remove('show-tap');
      }, 1000);
    }, TAP_TEXT_DELAY_MS);
    armTimer = setTimeout(() => {
      disarm();
    }, 3000);
  }

  function disarm() {
    armed = false;
    clearTimeout(armTimer); armTimer = null;
    clearTimeout(tapTextTimer); tapTextTimer = null;
    clearTimeout(tapTextHideTimer); tapTextHideTimer = null;
    document.getElementById('btnAlert').classList.remove('armed', 'show-tap');
    document.getElementById('btnLabel').textContent = 'PANIC';
    document.getElementById('btnSub').textContent   = 'ALARM';
  }

  // ── Fire alarm ────────────────────────────────────────────────────
  async function fireAlarm() {
    if (isFiring || !config?.token) return;
    isFiring = true;
    const btn = document.getElementById('btnAlert');
    document.getElementById('btnLabel').textContent = 'SENDING';
    document.getElementById('btnSub').textContent   = '…';

    let sent = false;
    let attempts = 0;
    const maxAttempts = 10; // Continuous retry attempts

    let notDelivered = false;   // server got the press but NO other station received it
    while (!sent && attempts < maxAttempts) {
      attempts++;
      try {
        const resp = await fetch(`${config.serverUrl}/api/client/alarm/trigger`, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
          body   : JSON.stringify({ retry: attempts }),
          signal : AbortSignal.timeout(6000),   // server may wait ~2 s for stations to confirm
        });
        if (resp.ok) {
          const body = await resp.json().catch(() => ({}));
          sent = !body.ignored; // server ignores alarms inside its 20 s lock
          // delivered === 0 means nobody received it. (Older servers send no count — treated as sent.)
          if (sent && body.delivered === 0) notDelivered = true;
          if (sent) break;
        }
      } catch (err) {
        console.warn(`[Alarm] Transmission attempt ${attempts} failed:`, err.message);
      }

      if (attempts >= 2 && !sent) {
        document.getElementById('btnLabel').textContent = 'RETRY';
        document.getElementById('btnSub').textContent = `[${attempts}]`;
      }
      await new Promise(r => setTimeout(r, 500));
    }

    // NOT sent (server unreachable, or reached but nobody received it): silent — no sound, no popup,
    // nothing the person next to the user could notice. Only a short text on the button, and the
    // button is free to be pressed again immediately.
    if (!sent || notDelivered) {
      showStatus('NOT', 'SENT!', 'fail', 2000);   // a click during these 2 s clears it and resends at once
      if (!sent && api.notifyAlarmFailure) api.notifyAlarmFailure();
      if (sent && notDelivered && api.notifyAlarmNotDelivered) api.notifyAlarmNotDelivered();
      isFiring = false;
      return;
    }

    // Success: Change to solid RED for next 20 seconds
    showStatus('SENT', 'OK', 'ok', 1000);
    isSolid = true;
    applyColour(0); // Index 0 is Red [220, 38, 38]
    if (sentSolidTimer) clearTimeout(sentSolidTimer);
    sentSolidTimer = setTimeout(() => {
      sentSolidTimer = null;
      isSolid = config?.alertButtonSolid ?? false;
      applyColour(config?.alertButtonColour ?? 3);
    }, 20000);

    setTimeout(() => { isFiring = false; }, 2000);
  }
</script>
</body>
</html>
