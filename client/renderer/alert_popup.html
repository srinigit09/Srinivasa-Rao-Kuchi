<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>PANIC ALARM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 580px; height: 340px; overflow: hidden; background: #1a0000; font-family: -apple-system,"Segoe UI",sans-serif; }
.popup {
  width: 580px; height: 340px;
  background: linear-gradient(155deg, #1a0000 0%, #3d0000 100%);
  border: 4px solid #e74c3c;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 36px; position: relative; color: #fff;
}
.blink-bar { position: absolute; top: 0; left: 0; right: 0; height: 7px; background: #e74c3c; animation: blk .5s step-start infinite; }
@keyframes blk { 50% { background: #ffcc00; } }
.icon { font-size: 48px; margin-bottom: 4px; animation: shake 0.6s ease-in-out infinite alternate; }
@keyframes shake { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
.heading { font-size: 26px; font-weight: 900; color: #ff4444; letter-spacing: 4px; text-transform: uppercase; }
.user-name { margin-top: 10px; font-size: 22px; font-weight: 800; color: #fff; text-align: center; }
.room-detail { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.75); text-align: center; }
.time-detail { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,0.4); }
.btn-row { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
/* ACKNOWLEDGE button — always active */
.btn-ack {
  padding: 12px 24px; background: rgba(39,174,96,0.25); color: #2ecc71;
  border: 2px solid rgba(39,174,96,0.5); border-radius: 8px; font-size: 13px;
  font-weight: 700; cursor: pointer; transition: all .2s;
}
.btn-ack:hover:not(:disabled) { background: #27ae60; color: #fff; border-color: #27ae60; }
.btn-ack:disabled { opacity: 0.4; cursor: default; }
/* CLOSE button — disabled until 15 s */
.btn-close {
  padding: 12px 32px; color: #fff;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 800;
  cursor: not-allowed; transition: all .2s;
  background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.35);
  border: 2px solid rgba(255,255,255,0.15);
}
.btn-close.unlocked {
  background: #e74c3c; color: #fff; border-color: #e74c3c; cursor: pointer;
}
.btn-close.unlocked:hover { background: #c0392b; }
.timer {
  font-size: 13px; font-weight: 700;
  color: #ffcc00; margin-top: 8px;
  min-height: 20px; text-align: center;
}
.timer.done { color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 400; }
</style>
</head>
<body>
<div class="popup">
  <div class="blink-bar"></div>
  <div class="icon">🚨</div>
  <div class="heading">PANIC ALARM</div>
  <div class="user-name"   id="userName">—</div>
  <div class="room-detail" id="roomDetail"></div>
  <div class="time-detail" id="timeDetail"></div>
  <div class="btn-row">
    <button class="btn-ack"   id="btnAck">ACKNOWLEDGE</button>
    <button class="btn-close" id="btnClose" disabled title="Close button unlocks after 15 seconds">
      CLOSE (15s)
    </button>
  </div>
  <div class="timer" id="timerLabel">Close button unlocks in 15s…</div>
</div>

<script>
  const api = window.electronAPI;
  let countdown = 15;           // close button unlock countdown
  let timerInterval = null;
  let currentAlarmId = null;
  let config = null;

  api.getConfig().then(c => { config = c; });

  function startCountdown() {
    clearInterval(timerInterval);
    countdown = 15;
    const btnClose  = document.getElementById('btnClose');
    const timerLbl  = document.getElementById('timerLabel');

    // Reset close button to locked state
    btnClose.disabled = true;
    btnClose.className = 'btn-close';
    btnClose.textContent = `CLOSE (15s)`;
    timerLbl.className = 'timer';
    timerLbl.textContent = `Close button unlocks in ${countdown}s…`;

    timerInterval = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        btnClose.textContent = `CLOSE (${countdown}s)`;
        timerLbl.textContent = `Close button unlocks in ${countdown}s…`;
      } else {
        clearInterval(timerInterval);
        // Unlock the close button
        btnClose.disabled = false;
        btnClose.className = 'btn-close unlocked';
        btnClose.textContent = 'CLOSE';
        timerLbl.className = 'timer done';
        timerLbl.textContent = 'You can now close this alert';
      }
    }, 1000);
  }

  api.onNewAlarm(data => {
    currentAlarmId = data.alarmId;
    document.getElementById('userName').textContent   = data.triggeredBy || '—';
    const uid = data.userId ? `  ·  ID: ${data.userId}` : '';
    document.getElementById('roomDetail').textContent =
      `Room: ${data.roomNumber || '—'}${uid}   ·   Hospital: ${data.hospitalCode || '—'}`;
    document.getElementById('timeDetail').textContent = `Triggered at: ${new Date(data.triggeredAt).toLocaleString()}`;
    document.getElementById('btnAck').disabled = false;
    document.getElementById('btnAck').textContent = 'ACKNOWLEDGE';
    startCountdown();
  });

  api.onAlarmAcked(({ alarmId, ackBy }) => {
    if (alarmId === currentAlarmId) {
      document.getElementById('btnAck').textContent = `✔ Acknowledged by ${ackBy}`;
      document.getElementById('btnAck').disabled = true;
    }
  });

  // CLOSE button — only works after 15 s countdown
  document.getElementById('btnClose').addEventListener('click', () => {
    if (!document.getElementById('btnClose').classList.contains('unlocked')) return;
    clearInterval(timerInterval);
    api.dismissAlert();
  });

  // ACKNOWLEDGE button — always clickable
  document.getElementById('btnAck').addEventListener('click', async () => {
    if (!config || !currentAlarmId) return;
    const btn = document.getElementById('btnAck');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const resp = await fetch(`${config.serverUrl}/api/client/alarm/acknowledge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body: JSON.stringify({ alarmId: currentAlarmId }),
      });
      btn.textContent = resp.ok ? '✔ Acknowledged' : 'Retry';
      if (!resp.ok) btn.disabled = false;
    } catch {
      btn.textContent = 'Retry'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
