<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>PANIC ALARM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 580px; height: 300px; overflow: hidden; background: #1a0000; font-family: -apple-system,"Segoe UI",sans-serif; }
.popup {
  width: 580px; height: 300px;
  background: linear-gradient(155deg, #1a0000 0%, #3d0000 100%);
  border: 4px solid #e74c3c;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 36px; position: relative; color: #fff;
}
.blink-bar { position: absolute; top: 0; left: 0; right: 0; height: 7px; background: #e74c3c; animation: blk .5s step-start infinite; }
@keyframes blk { 50% { background: #ffcc00; } }
.icon { font-size: 44px; margin-bottom: 4px; animation: shake 0.6s ease-in-out infinite alternate; }
@keyframes shake { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
.heading { font-size: 24px; font-weight: 900; color: #ff4444; letter-spacing: 4px; text-transform: uppercase; }
.user-name { margin-top: 8px; font-size: 20px; font-weight: 800; color: #fff; text-align: center; }
.room-detail { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.75); text-align: center; }
.time-detail { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,0.4); }
.btn-row { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
/* OK button — records acknowledgement and closes */
.btn-ok {
  padding: 12px 40px;
  background: #e74c3c; color: #fff;
  border: none; border-radius: 8px; font-size: 15px;
  font-weight: 800; cursor: pointer; transition: all .2s;
}
.btn-ok:hover { background: #c0392b; }
.timer {
  font-size: 13px; font-weight: 700;
  color: #ffcc00; margin-top: 8px;
  min-height: 20px; text-align: center;
}
.timer.done { color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 400; }
</style>
</head>
<body>
<div class="popup">
  <div class="blink-bar"></div>
  <div class="icon">🚨</div>
  <div class="heading">PANIC ALARM</div>
  <div class="user-name"   id="userName">—</div>
  <div class="room-detail" id="roomDetail"></div>
  <div class="time-detail" id="timeDetail"></div>
  <div class="btn-row">
    <button class="btn-ok" id="btnOk">OK</button>
  </div>
  <div class="timer" id="timerLabel">Auto-closing in 30s…</div>
</div>

<script>
  const api = window.electronAPI;
  let countdown = 30;          // auto-close countdown in seconds
  let timerInterval = null;
  let currentAlarmId = null;
  let config = null;
  let acknowledged = false;

  api.getConfig().then(c => { config = c; });

  function startCountdown() {
    clearInterval(timerInterval);
    countdown = 30;
    acknowledged = false;
    const timerLbl = document.getElementById('timerLabel');
    timerLbl.className = 'timer';
    timerLbl.textContent = `Auto-closing in ${countdown}s…`;

    timerInterval = setInterval(async () => {
      countdown--;
      if (countdown > 0) {
        timerLbl.textContent = `Auto-closing in ${countdown}s…`;
      } else {
        clearInterval(timerInterval);
        timerLbl.className = 'timer done';
        timerLbl.textContent = 'Closing…';
        // Log "No Response" if OK was never clicked
        if (!acknowledged) {
          await logNoResponse();
        }
        api.dismissAlert();
      }
    }, 1000);
  }

  async function logNoResponse() {
    if (!config || !currentAlarmId) return;
    try {
      await fetch(`${config.serverUrl}/api/client/alarm/no-response`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body: JSON.stringify({ alarmId: currentAlarmId }),
      });
    } catch { /* best effort */ }
  }

  api.onNewAlarm(data => {
    currentAlarmId = data.alarmId;
    document.getElementById('userName').textContent   = data.triggeredBy || '—';
    const uid = data.userId ? `  ·  ID: ${data.userId}` : '';
    document.getElementById('roomDetail').textContent =
      `Room: ${data.roomNumber || '—'}${uid}   ·   Hospital: ${data.hospitalCode || '—'}`;
    document.getElementById('timeDetail').textContent = `Triggered at: ${new Date(data.triggeredAt).toLocaleString()}`;
    startCountdown();
  });

  // OK button — records acknowledgement and closes
  document.getElementById('btnOk').addEventListener('click', async () => {
    if (!config || !currentAlarmId) { api.dismissAlert(); return; }
    clearInterval(timerInterval);
    acknowledged = true;
    const btn = document.getElementById('btnOk');
    btn.disabled = true;
    btn.textContent = '✔ Acknowledged';
    try {
      await fetch(`${config.serverUrl}/api/client/alarm/acknowledge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body: JSON.stringify({ alarmId: currentAlarmId }),
      });
    } catch { /* best effort */ }
    setTimeout(() => api.dismissAlert(), 400);
  });
</script>
</body>
</html>
