<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *;">
<title>PANIC ALARM</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 580px; height: 350px; overflow: hidden; background: #1a0000; font-family: -apple-system,"Segoe UI",sans-serif; }
.popup {
  width: 580px; height: 350px;
  background: linear-gradient(155deg, #1a0000 0%, #3d0000 100%);
  border: 4px solid #e74c3c;
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 36px; position: relative; color: #fff;
}
/* Title sits at the exact vertical middle: equal flexible space above and below it */
.top-space { flex: 1; }
.lower { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; }
.blink-bar { position: absolute; top: 0; left: 0; right: 0; height: 7px; background: #e74c3c; animation: blk .5s step-start infinite; }
@keyframes blk { 50% { background: #ffcc00; } }
.title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.icon { display: inline-block; font-size: 40px; animation: shake 0.6s ease-in-out infinite alternate; }
@keyframes shake { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
.heading { font-size: 28px; font-weight: 900; color: #ff4444; letter-spacing: 4px; text-transform: uppercase; }
.detail { margin-top: 14px; font-size: 24px; font-weight: 800; text-align: center; word-break: break-word; }
.user-name { color: #fff; }
.sep { color: rgba(255,255,255,0.5); }
.room-detail { color: #ffcc00; }
.btn-row { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
/* OK button — records acknowledgement and closes */
.btn-ok {
  padding: 12px 40px;
  background: #e74c3c; color: #fff;
  border: none; border-radius: 8px; font-size: 15px;
  font-weight: 800; cursor: pointer; transition: all .2s;
}
.btn-ok:hover { background: #c0392b; }
.timer {
  font-size: 13px; font-weight: 700;
  color: #ffcc00; margin-top: 8px;
  min-height: 20px; text-align: center;
}
.timer.done { color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 400; }
</style>
</head>
<body>
<div class="popup">
  <div class="blink-bar"></div>
  <div class="top-space"></div>
  <div class="title-row">
    <span class="icon">🚨</span>
    <span class="heading">PANIC ALARM</span>
  </div>
  <div class="lower">
    <div class="detail">
      <span class="user-name" id="userName">—</span>
      <span class="sep"> - </span>
      <span class="room-detail" id="roomDetail"></span>
    </div>
    <div class="btn-row">
      <button class="btn-ok" id="btnOk">OK</button>
    </div>
    <div class="timer" id="timerLabel">Auto-closing in 20s…</div>
  </div>
</div>

<script>
  const api = window.electronAPI;
  let countdown = 20;          // auto-close countdown in seconds
  let timerInterval = null;
  let currentAlarmId = null;
  let pendingAlarmIds = new Set();   // every alarm shown in this popup and not yet resolved
  let config = null;
  let acknowledged = false;

  api.getConfig().then(c => { config = c; });

  function startCountdown() {
    clearInterval(timerInterval);
    countdown = 20;
    acknowledged = false;
    const timerLbl = document.getElementById('timerLabel');
    timerLbl.className = 'timer';
    timerLbl.textContent = `Auto-closing in ${countdown}s…`;

    timerInterval = setInterval(async () => {
      countdown--;
      if (countdown > 0) {
        timerLbl.textContent = `Auto-closing in ${countdown}s…`;
      } else {
        clearInterval(timerInterval);
        timerLbl.className = 'timer done';
        timerLbl.textContent = 'Closing…';
        // Log "No Response" if OK was never clicked
        if (!acknowledged) {
          await logNoResponse();
        }
        api.dismissAlert();
      }
    }, 1000);
  }

  async function postForAll(path) {
    if (!config) return;
    const ids = [...pendingAlarmIds];
    pendingAlarmIds.clear();
    await Promise.all(ids.map(alarmId =>
      fetch(`${config.serverUrl}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.token}` },
        body: JSON.stringify({ alarmId }),
      }).catch(() => { /* best effort */ })
    ));
  }

  async function logNoResponse() { await postForAll('/api/client/alarm/no-response'); }

  function handleAlarm(data) {
    if (!data) return;
    currentAlarmId = data.alarmId;
    pendingAlarmIds.add(data.alarmId);   // keep earlier unresolved alarms so OK/timeout covers them too
    document.getElementById('userName').textContent   = data.triggeredBy || '—';
    // locationLabel already carries the field name, e.g. "Consulting Room: 12" or "Reception Area"
    document.getElementById('roomDetail').textContent = data.locationLabel || data.roomNumber || '—';
    startCountdown();
  }

  api.getCurrentAlarm().then(d => { if (d) handleAlarm(d); });
  api.onNewAlarm(handleAlarm);

  // OK button — records acknowledgement and closes
  document.getElementById('btnOk').addEventListener('click', async () => {
    if (!config || !currentAlarmId) { api.dismissAlert(); return; }
    clearInterval(timerInterval);
    acknowledged = true;
    const btn = document.getElementById('btnOk');
    btn.disabled = true;
    btn.textContent = '✔ Acknowledged';
    await postForAll('/api/client/alarm/acknowledge');
    setTimeout(() => api.dismissAlert(), 400);
  });
</script>
</body>
</html>
