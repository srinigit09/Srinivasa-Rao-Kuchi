<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A38A8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#4A74FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1A38A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#AABFE8"/>
    </linearGradient>
    <linearGradient id="wallFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#D4E0F8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A9EE8"/>
      <stop offset="100%" stop-color="#3E75CC"/>
    </linearGradient>
    <linearGradient id="doorFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7498DC"/>
      <stop offset="100%" stop-color="#4A6DC0"/>
    </linearGradient>
    <filter id="hShadow" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06123A" flood-opacity="0.38"/>
    </filter>
    <filter id="tShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#06123A" flood-opacity="0.50"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bloom)"/>

  <!--
    LAYOUT — compact house in upper half, large plain label below.

    House:  apex y=210, eave y=390  → roof height=180
    Walls:  y=387 → y=560           → wall height=173
    Gap:    560→610  (50px)
    Label:  y=700 (text baseline)   → font-size=112

    Eaves:  left=282, right=742 (span 460, centred 512 ✓)
    Walls:  left=312, right=712 (span 400, centred 512 ✓)
  -->

  <!-- ══ HOUSE ══ -->
  <g filter="url(#hShadow)">

    <!-- Roof: apex(512,210) eave-left(282,390) eave-right(742,390) -->
    <polygon points="512,210  282,390  742,390" fill="url(#roofFill)"/>
    <line x1="282" y1="390" x2="742" y2="390" stroke="#8AAAD8" stroke-width="3.5"/>

    <!-- Walls: x=312 y=387 w=400 h=173 → base y=560 -->
    <rect x="312" y="387" width="400" height="173" fill="url(#wallFill)"/>
    <rect x="312" y="387" width="18" height="173" fill="rgba(30,60,160,0.16)"/>
    <rect x="694" y="387" width="18" height="173" fill="rgba(30,60,160,0.16)"/>

    <!-- Left window: 88×70 -->
    <rect x="338" y="408" width="88" height="70" rx="9" fill="url(#glass)"/>
    <rect x="338" y="408" width="88" height="70" rx="9" fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <line x1="382" y1="408" x2="382" y2="478" stroke="#2E5BAA" stroke-width="2"/>
    <line x1="338" y1="443" x2="426" y2="443" stroke="#2E5BAA" stroke-width="2"/>
    <rect x="342" y="412" width="22" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>

    <!-- Right window: 88×70 -->
    <rect x="586" y="408" width="88" height="70" rx="9" fill="url(#glass)"/>
    <rect x="586" y="408" width="88" height="70" rx="9" fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <line x1="630" y1="408" x2="630" y2="478" stroke="#2E5BAA" stroke-width="2"/>
    <line x1="586" y1="443" x2="674" y2="443" stroke="#2E5BAA" stroke-width="2"/>
    <rect x="590" y="412" width="22" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>

    <!-- Door: arch centred x=512, base y=560 -->
    <path d="M468,560 L468,490 Q468,460 512,460 Q556,460 556,490 L556,560 Z" fill="url(#doorFill)"/>
    <path d="M468,560 L468,490 Q468,460 512,460 Q556,460 556,490 L556,560 Z"
          fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <path d="M468,490 Q468,460 512,460 Q556,460 556,490"
          fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="3"/>
    <!-- Door knob -->
    <circle cx="544" cy="520" r="7" fill="#FBBF24"/>
    <circle cx="544" cy="520" r="3" fill="#FDE68A"/>

  </g>

  <!-- ══ PLAIN TEXT LABEL ══ — no box, no pill, just bold white text -->
  <g filter="url(#tShadow)">
    <text x="512" y="700"
          font-family="Arial,Helvetica,sans-serif"
          font-size="112" font-weight="800" letter-spacing="-1"
          text-anchor="middle" fill="#FFFFFF">RentEase</text>
  </g>

</svg>
