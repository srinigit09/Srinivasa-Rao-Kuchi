<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A38A8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="47%" r="46%">
      <stop offset="0%" stop-color="#4A74FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1A38A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8DCFF"/>
    </linearGradient>
    <linearGradient id="wallFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CDFF"/>
      <stop offset="100%" stop-color="#93B3FF"/>
    </linearGradient>
    <linearGradient id="doorFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A8BCFF"/>
      <stop offset="100%" stop-color="#83A4EE"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.36)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
    <filter id="hShadow" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#06123A" flood-opacity="0.42"/>
    </filter>
    <filter id="pShadow" x="-10%" y="-25%" width="120%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06123A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bloom)"/>

  <!--
    ══════════════════════════════════════════════════════
    LAYOUT — house + label only, no standalone key row.

    Shift down 5px, widen door slightly.
    House:  apex y=183, eave y=435, wall-base y=735
    Gap:    735→764  (29px)
    Pill:   764→842  (78px)
    Total:  183→842 = 659px
    Centre: 183+330 = 513 ≈ 512 ✓ EXACT
    Top:    183px   Bottom: 1024-842 = 182px ✓ symmetric

    Eaves: left=232, right=792 (span 560, centred 512 ✓)
    Walls: left=268, right=756 (span 488, centred 512 ✓)
    ══════════════════════════════════════════════════════
  -->

  <!-- ══ HOUSE ══ -->
  <g filter="url(#hShadow)">

    <!-- Roof: apex(512,183) eave-left(232,435) eave-right(792,435) -->
    <polygon points="512,183  232,435  792,435" fill="url(#roofFill)"/>
    <line x1="232" y1="435" x2="792" y2="435" stroke="#A2BEEE" stroke-width="4"/>

    <!-- Walls: x=268 y=432 w=488 h=303 → base y=735 -->
    <rect x="268" y="432" width="488" height="303" fill="url(#wallFill)"/>
    <rect x="268" y="432" width="22" height="303" fill="rgba(90,138,255,0.09)"/>
    <rect x="734" y="432" width="22" height="303" fill="rgba(90,138,255,0.09)"/>

    <!-- Left window -->
    <rect x="300" y="467" width="116" height="94" rx="11" fill="url(#glass)"/>
    <rect x="300" y="467" width="116" height="94" rx="11" fill="none" stroke="#7AA2E6" stroke-width="2.5"/>
    <line x1="358" y1="467" x2="358" y2="561" stroke="#7AA2E6" stroke-width="2.5"/>
    <line x1="300" y1="514" x2="416" y2="514" stroke="#7AA2E6" stroke-width="2.5"/>
    <rect x="304" y="471" width="24" height="8" rx="4" fill="rgba(255,255,255,0.42)"/>

    <!-- Right window -->
    <rect x="608" y="467" width="116" height="94" rx="11" fill="url(#glass)"/>
    <rect x="608" y="467" width="116" height="94" rx="11" fill="none" stroke="#7AA2E6" stroke-width="2.5"/>
    <line x1="666" y1="467" x2="666" y2="561" stroke="#7AA2E6" stroke-width="2.5"/>
    <line x1="608" y1="514" x2="724" y2="514" stroke="#7AA2E6" stroke-width="2.5"/>
    <rect x="612" y="471" width="24" height="8" rx="4" fill="rgba(255,255,255,0.42)"/>

    <!-- Door: wider arch-top centred x=512, base y=735 -->
    <path d="M452,735 L452,620 Q452,578 512,578 Q572,578 572,620 L572,735 Z" fill="url(#doorFill)"/>
    <path d="M452,735 L452,620 Q452,578 512,578 Q572,578 572,620 L572,735 Z"
          fill="none" stroke="#7AA2E6" stroke-width="2.5"/>
    <path d="M452,620 Q452,578 512,578 Q572,578 572,620"
          fill="none" stroke="rgba(255,255,255,0.52)" stroke-width="3"/>

    <!-- Door knob -->
    <circle cx="553" cy="672" r="9" fill="#FBBF24"/>
    <circle cx="553" cy="672" r="4" fill="#FDE68A"/>

  </g>

  <!-- ══ PILL LABEL ══  x=268 y=764 w=488 h=78 → centred x=512 -->
  <g filter="url(#pShadow)">
    <rect x="268" y="764" width="488" height="78" rx="39"
          fill="url(#pillFill)" stroke="rgba(255,255,255,0.42)" stroke-width="1.5"/>
    <text x="512" y="821"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="55" font-weight="800" letter-spacing="3"
          text-anchor="middle" fill="#FBBF24">RentEase</text>
  </g>

</svg>
