<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A38A8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#4A74FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1A38A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#AABFE8"/>
    </linearGradient>
    <linearGradient id="wallFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#D4E0F8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A9EE8"/>
      <stop offset="100%" stop-color="#3E75CC"/>
    </linearGradient>
    <linearGradient id="doorFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7498DC"/>
      <stop offset="100%" stop-color="#4A6DC0"/>
    </linearGradient>
    <filter id="hShadow" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06123A" flood-opacity="0.38"/>
    </filter>
    <filter id="tShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#06123A" flood-opacity="0.50"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="216" ry="216" fill="url(#bloom)"/>

  <!--
    LAYOUT — tight gap, entire block centred vertically.

    Total content: house 320px + gap 18px + label cap 80px = 418px
    Centred at 512 → top=512-209=303, bottom=512+209=721

    House:  apex y=303, eave y=463  → roof height=160
    Walls:  y=460 → y=623           → wall height=163
    Gap:    623→641  (18px)
    Label:  cap-top≈641, baseline y=721  → font-size=88

    Eaves span 508px:  left=258, right=766  (centred 512 ✓)
    Walls span 400px:  left=312, right=712  (centred 512 ✓)
    Label width ~400px: font-size=88, letter-spacing=1
  -->

  <!-- ══ HOUSE ══ -->
  <g filter="url(#hShadow)">

    <!-- Roof: apex(512,303) eave-left(258,463) eave-right(766,463) -->
    <polygon points="512,303  258,463  766,463" fill="url(#roofFill)"/>
    <line x1="258" y1="463" x2="766" y2="463" stroke="#8AAAD8" stroke-width="3.5"/>

    <!-- Walls: x=312 y=460 w=400 h=163 → base y=623 -->
    <rect x="312" y="460" width="400" height="163" fill="url(#wallFill)"/>
    <rect x="312" y="460" width="18" height="163" fill="rgba(30,60,160,0.16)"/>
    <rect x="694" y="460" width="18" height="163" fill="rgba(30,60,160,0.16)"/>

    <!-- Left window: 86×64 -->
    <rect x="338" y="477" width="86" height="64" rx="9" fill="url(#glass)"/>
    <rect x="338" y="477" width="86" height="64" rx="9" fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <line x1="381" y1="477" x2="381" y2="541" stroke="#2E5BAA" stroke-width="2"/>
    <line x1="338" y1="509" x2="424" y2="509" stroke="#2E5BAA" stroke-width="2"/>
    <rect x="342" y="481" width="22" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>

    <!-- Right window: 86×64 -->
    <rect x="588" y="477" width="86" height="64" rx="9" fill="url(#glass)"/>
    <rect x="588" y="477" width="86" height="64" rx="9" fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <line x1="631" y1="477" x2="631" y2="541" stroke="#2E5BAA" stroke-width="2"/>
    <line x1="588" y1="509" x2="674" y2="509" stroke="#2E5BAA" stroke-width="2"/>
    <rect x="592" y="481" width="22" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>

    <!-- Door: arch centred x=512, base y=623 -->
    <path d="M468,623 L468,553 Q468,525 512,525 Q556,525 556,553 L556,623 Z" fill="url(#doorFill)"/>
    <path d="M468,623 L468,553 Q468,525 512,525 Q556,525 556,553 L556,623 Z"
          fill="none" stroke="#2E5BAA" stroke-width="2.5"/>
    <path d="M468,553 Q468,525 512,525 Q556,525 556,553"
          fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="3"/>
    <!-- Door knob -->
    <circle cx="544" cy="583" r="7" fill="#FBBF24"/>
    <circle cx="544" cy="583" r="3" fill="#FDE68A"/>

  </g>

  <!-- ══ PLAIN TEXT LABEL ══ — tight gap below house, centred with it -->
  <g filter="url(#tShadow)">
    <text x="512" y="721"
          font-family="Arial Black,Arial,Helvetica,sans-serif"
          font-size="88" font-weight="900" letter-spacing="1"
          text-anchor="middle" fill="#FFFFFF">RentEase</text>
  </g>

</svg>
