name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days at 06:00 UTC
  workflow_dispatch:         # allows manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS --max-time 20 -o response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/subscription_plans?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "HTTP status: ${status}"
          cat response.txt
          echo
          if [ "${status}" -ge 400 ]; then exit 1; fi
